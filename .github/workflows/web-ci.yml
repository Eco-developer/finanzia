name: FinanZIA Web CI

on:
  push:
    paths:
      - 'finanzia-web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'finanzia-web/**'
      - '.github/workflows/web-ci.yml'

jobs:
  validate-web:
    name: Typecheck, Build and Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finanzia-web

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: finanzia-web/package.json

      - name: Instalar Dependencias
        run: npm ci || npm install

      - name: Ejecutar Tests Unitarios (Vitest / React Testing Library)
        run: npm test

      - name: Compilar Frontend Next.js (Build)
        run: npm run build
