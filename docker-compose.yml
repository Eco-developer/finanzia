name: finanzia

services:
  # Base de Datos PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: finanzia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finanzia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finanzia_password}
      POSTGRES_DB: ${POSTGRES_DB:-finanzia_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - finanzia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finanzia_user} -d ${POSTGRES_DB:-finanzia_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finanzia-network

  # API Backend NestJS
  api:
    build:
      context: ./finanzia-api
      dockerfile: docker/Dockerfile.dev
    container_name: finanzia-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm run start:dev"
    environment:
      PORT: 3001
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-finanzia_user}:${POSTGRES_PASSWORD:-finanzia_password}@postgres:5432/${POSTGRES_DB:-finanzia_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_finanzia_super_secure_32_chars}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "3001:3001"
    volumes:
      - ./finanzia-api/src:/app/src
      - ./finanzia-api/prisma:/app/prisma
      - ./finanzia-api/test:/app/test
    networks:
      - finanzia-network

  # Frontend Web Next.js + Storybook
  web:
    build:
      context: ./finanzia-web
      dockerfile: docker/Dockerfile.dev
    container_name: finanzia-web
    restart: unless-stopped
    depends_on:
      - api
    command: sh -c "npx storybook dev -p 6006 --ci --host 0.0.0.0 & npm run dev"
    ports:
      - "3000:3000"
      - "6006:6006"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
      - INTERNAL_API_URL=http://api:3001/api
    volumes:
      - ./finanzia-web/src:/app/src
      - ./finanzia-web/public:/app/public
      - ./finanzia-web/stories:/app/stories
      - ./finanzia-web/.storybook:/app/.storybook
    networks:
      - finanzia-network

volumes:
  finanzia_pgdata:
    name: finanzia_pgdata
    external: true

networks:
  finanzia-network:
    name: finanzia-network
    external: true
