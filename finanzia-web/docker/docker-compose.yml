services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: finanzia-web
    restart: unless-stopped
    command: sh -c "npx storybook dev -p 6006 --ci --host 0.0.0.0 & npm run dev"
    ports:
      - "3000:3000"
      - "6006:6006"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - INTERNAL_API_URL=http://api:3001
    volumes:
      - ../src:/app/src
      - ../public:/app/public
      - ../stories:/app/stories
      - ../.storybook:/app/.storybook
    networks:
      - finanzia-network

networks:
  finanzia-network:
    external: true
    name: finanzia-network
